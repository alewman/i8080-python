# Rungs 1, 2, and 4 on every push: the per-opcode and lifecycle tests, the
# readability contract, and 8080PRE/TST8080 under cpm-minimal (the pinned
# exercisers are fetched by hash; nothing is vendored). Rung 3 (8080EXM)
# runs in oracles.yml; rung 5 needs MAME and the invaders ROM set and runs
# locally (docs/validation.md).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/fetch_exercisers.py
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # The debugger front end, end to end on a real image.
      - run: >
          python -m i8080_python --load tests/exercisers/8080PRE.COM@0x100
          --pc 0x100 --batch -c "step 5" -c "registers"
