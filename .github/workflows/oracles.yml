# Rung 3: 8080EXM, whose 25 CRCs were captured on real 8080A chips. About
# 2.9 billion instructions: ~2.5 minutes under PyPy, hours under CPython, so
# weekly and on demand rather than on every push. CPUTEST is proprietary and
# is not fetched here.
name: Oracles

on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays, 06:41 UTC
  workflow_dispatch:

jobs:
  exm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/fetch_exercisers.py
      - name: 8080EXM, 25 hardware-captured CRCs
        run: python -m pytest -q -m slow tests/test_exercisers.py::test_8080exm_hardware_crcs
